name: pulsevote
description: >-
  PulseVote — a lightweight, privacy-conscious community voting platform for
  informal elections, contests, awards, club elections, and ranked polls.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
