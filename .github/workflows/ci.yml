name: Mobile CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          # Android project uses AGP 9 / Gradle 9, supported from Flutter 3.44.
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      # Keep legacy style findings visible while failing on warnings and errors.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage --dart-define=USE_REAL_API=false
      - run: >-
          flutter build apk --debug
          --dart-define=USE_REAL_API=true
          --dart-define=GATEWAY_BASE_URL=https://api.electrahub.net
      - uses: actions/upload-artifact@v4
        with:
          name: pulsevote-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
